name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check the version is the same everywhere
        run: |
          v=$(node -p "require('./package.json').version")
          at_version() { grep -q "$1" "$2" || { echo "$2 is not at version $v"; exit 1; }; }
          at_version "^version = \"$v\"$" src-tauri/Cargo.toml
          at_version "\"version\": \"$v\"" src-tauri/tauri.conf.json
          at_version "<release version=\"$v\"" src-tauri/io.github.gingerbreadfork.bedsheet.metainfo.xml
          grep -A1 '^name = "bedsheet"$' src-tauri/Cargo.lock | grep -q "^version = \"$v\"$" \
            || { echo "src-tauri/Cargo.lock is not at version $v"; exit 1; }
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: mkdir -p dist && echo '<!doctype html><title>bedsheet</title>' > dist/index.html
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  rust-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: mkdir -p dist && echo '<!doctype html><title>bedsheet</title>' > dist/index.html
        shell: bash
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
